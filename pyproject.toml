[project]
name = "ko-bridge"
version = "0.1.0"
description = "MCP server that lets an AI model drive a Teenage Engineering EP-133 K.O. II over USB MIDI, SysEx and USB audio"
readme = "README.md"
authors = [
    { name = "CrabbTech", email = "crabbtech@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "epsysex[device]",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "numpy>=1.26",
    "scipy>=1.12",
]

[tool.uv.sources]
# Community EP-series SysEx protocol (MIT). Pinned to the commit whose docs the spike was read against.
epsysex = { git = "https://github.com/kmorrill/ep-series-sysex.git", rev = "891a905c5faf8b5c7b0ae1bdfee260c21f7417eb" }

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
